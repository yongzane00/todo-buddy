[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-companion"
version = "0.1.0"
description = "A local-first floating quest card for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
graph = [
    "msal>=1.30,<2",
    "requests>=2.32,<3",
]
package = [
    "pyinstaller>=6.10,<7",
]
tools = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.gui-scripts]
todo-companion = "todo_companion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
